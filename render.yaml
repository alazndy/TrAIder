services:
  - type: web
    name: traider-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    repo: https://github.com/alazndy/TrAIder
    region: frankfurt
    plan: free
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
    # Run the Main API (which launches the trader thread)
    startCommand: python main.py

  - type: web
    name: traider-frontend
    env: node
    repo: https://github.com/alazndy/TrAIder
    branch: master
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://traider-backend.onrender.com # Auto-discovery is tricky with CORS, hardcoding or using internal might fail for client-side fetches.
        # Actually, for client-side fetches, we need the PUBLIC URL. 
        # fromService provides the internal URL usually? No, Render provides public URL via host property.
        # But let's stick to a placeholder or manual setup for now to avoid circular dependency if name changes.
        # Better yet, use the fromService syntax which is supported by Render Blueprints.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: traider-backend
          envVarKey: RENDER_EXTERNAL_URL # Render exposes this automatically

